databaseChangeLog:

  - changeSet:
      id: 001-create-transactions
      author: transaction-platform

      changes:

        - createTable:
            tableName: transactions
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(19, 4)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: merchant_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: country
                  type: CHAR(2)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - createIndex:
            tableName: transactions
            indexName: idx_transactions_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: transactions
            indexName: idx_transactions_created_at
            columns:
              - column:
                  name: created_at